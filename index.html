<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SHRUTI AI // CYBERNETIC HUD INTERFACE</title>

  <!-- Google Fonts for Cyberpunk Aesthetics -->
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">

  <!-- Three.js Library for 3D Hologram Orb -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

  <style>
    /* ========================================== */
    /* 1. ROOT VARS & GLOBAL RESETS               */
    /* ========================================== */
    :root {
      --bg-dark: #030712;
      --cyan-glow: #00f3ff;
      --magenta-glow: #ff0055;
      --glass-bg: rgba(6, 12, 26, 0.65);
      --glass-border: rgba(0, 243, 255, 0.25);
      --font-orbitron: 'Orbitron', sans-serif;
      --font-mono: 'Share Tech Mono', monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      background-color: var(--bg-dark);
      color: #fff;
      font-family: var(--font-mono);
      min-height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 20px;
      position: relative;
    }

    /* Ambient CRT Scanline Overlay */
    body::before {
      content: "";
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%);
      background-size: 100% 4px;
      z-index: 100;
      pointer-events: none;
      opacity: 0.6;
    }

    /* ========================================== */
    /* 2. HEADER & TOP STATUS BAR                */
    /* ========================================== */
    header {
      width: 100%;
      max-width: 1200px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px 25px;
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      backdrop-filter: blur(10px);
      box-shadow: 0 0 20px rgba(0, 243, 255, 0.1);
      z-index: 10;
    }

    .brand h1 {
      font-family: var(--font-orbitron);
      font-size: 24px;
      letter-spacing: 4px;
      color: var(--cyan-glow);
      text-shadow: 0 0 10px var(--cyan-glow);
    }

    .status-indicators {
      display: flex;
      gap: 20px;
      font-size: 12px;
      letter-spacing: 1px;
    }

    .status-badge {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #00ff66;
      box-shadow: 0 0 8px #00ff66;
    }

    .dot.offline { background: var(--magenta-glow); box-shadow: 0 0 8px var(--magenta-glow); }

    /* ========================================== */
    /* 3. MAIN CENTERPIECE: 3D HOLOGRAM ORB       */
    /* ========================================== */
    main {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      width: 100%;
      flex-grow: 1;
    }

    .hologram-3d-viewport {
      width: 340px;
      height: 340px;
      cursor: pointer;
      position: relative;
      border-radius: 50%;
      transition: transform 0.2s ease;
    }

    .hologram-3d-viewport:hover {
      transform: scale(1.03);
    }

    .hologram-3d-viewport canvas {
      border-radius: 50%;
    }

    /* Subtitle & Response Overlay */
    .response-container {
      margin-top: 25px;
      max-width: 700px;
      width: 90%;
      min-height: 80px;
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      backdrop-filter: blur(12px);
      padding: 18px 24px;
      text-align: center;
      font-size: 16px;
      color: #e0f7fc;
      line-height: 1.5;
      box-shadow: 0 0 30px rgba(0, 243, 255, 0.15);
      z-index: 10;
    }

    /* ========================================== */
    /* 4. CONTROLS & VOICE TERMINAL               */
    /* ========================================== */
    footer {
      width: 100%;
      max-width: 800px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 15px;
      z-index: 10;
      margin-bottom: 10px;
    }

    .controls-bar {
      display: flex;
      gap: 15px;
      width: 100%;
    }

    .input-box {
      flex-grow: 1;
      background: rgba(3, 7, 18, 0.8);
      border: 1px solid var(--glass-border);
      padding: 14px 20px;
      color: var(--cyan-glow);
      font-family: var(--font-mono);
      font-size: 15px;
      outline: none;
    }

    .input-box:focus {
      border-color: var(--cyan-glow);
      box-shadow: 0 0 15px rgba(0, 243, 255, 0.3);
    }

    .btn {
      background: var(--glass-bg);
      border: 1px solid var(--cyan-glow);
      color: var(--cyan-glow);
      padding: 0 24px;
      font-family: var(--font-orbitron);
      font-size: 12px;
      letter-spacing: 2px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn:hover {
      background: var(--cyan-glow);
      color: #000;
      box-shadow: 0 0 20px var(--cyan-glow);
    }

    .btn-mic {
      border-color: var(--magenta-glow);
      color: var(--magenta-glow);
    }

    .btn-mic:hover {
      background: var(--magenta-glow);
      color: #fff;
      box-shadow: 0 0 20px var(--magenta-glow);
    }

    /* ========================================== */
    /* 5. CLASSIFIED SECRET OVERRIDE PANEL        */
    /* ========================================== */
    .secret-overlay {
      position: fixed;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      background: rgba(0, 0, 0, 0.88);
      backdrop-filter: blur(15px);
      z-index: 9999;
      display: flex;
      justify-content: center;
      align-items: center;
      animation: fadeIn 0.25s ease-out;
    }

    .secret-card {
      width: 500px;
      max-width: 90%;
      background: #060c1a;
      border: 2px solid var(--magenta-glow);
      box-shadow: 0 0 40px rgba(255, 0, 85, 0.4), inset 0 0 15px rgba(255, 0, 85, 0.2);
      padding: 25px;
      color: #fff;
      font-family: var(--font-mono);
    }

    .secret-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px dashed var(--magenta-glow);
      padding-bottom: 12px;
      margin-bottom: 20px;
    }

    .secret-header h2 {
      font-family: var(--font-orbitron);
      font-size: 15px;
      color: var(--magenta-glow);
      letter-spacing: 2px;
      text-shadow: 0 0 8px var(--magenta-glow);
    }

    .close-secret-btn {
      background: transparent;
      border: none;
      color: var(--magenta-glow);
      font-size: 22px;
      cursor: pointer;
    }

    .secret-body {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .secret-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
    }

    .secret-btn {
      background: rgba(0, 243, 255, 0.1);
      border: 1px solid var(--cyan-glow);
      color: var(--cyan-glow);
      padding: 8px 14px;
      font-family: var(--font-orbitron);
      font-size: 11px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .secret-btn:hover {
      background: var(--cyan-glow);
      color: #000;
      box-shadow: 0 0 15px var(--cyan-glow);
    }

    .secret-btn.danger {
      border-color: var(--magenta-glow);
      color: var(--magenta-glow);
    }

    .secret-btn.danger:hover {
      background: var(--magenta-glow);
      color: #fff;
      box-shadow: 0 0 15px var(--magenta-glow);
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.95); }
      to { opacity: 1; transform: scale(1); }
    }
  </style>
</head>
<body>

  <!-- TOP HEADER -->
  <header>
    <div class="brand">
      <h1>SHRUTI AI</h1>
    </div>
    <div class="status-indicators">
      <div class="status-badge">
        <div class="dot" id="groqStatus"></div>
        <span>GROQ LLaMA 3</span>
      </div>
      <div class="status-badge">
        <div class="dot" id="voiceStatus"></div>
        <span>XTTS v2 ENGINE</span>
      </div>
    </div>
  </header>

  <!-- MAIN HOLOGRAM ORB DISPLAY -->
  <main>
    <div class="hologram-3d-viewport" id="hologramContainer" title="Click 5x fast for secret panel"></div>
    
    <div class="response-container" id="responseText">
      SYSTEM READY. AWAITING USER COMMAND...
    </div>
  </main>

  <!-- BOTTOM CONTROL INPUTS -->
  <footer>
    <div class="controls-bar">
      <input type="text" id="userInput" class="input-box" placeholder="Type or click voice command..." onkeydown="if(event.key==='Enter') processUserPrompt()">
      <button class="btn btn-mic" onclick="startVoiceRecognition()">VOICE</button>
      <button class="btn" onclick="processUserPrompt()">SEND</button>
    </div>
  </footer>

  <!-- SECRET OVERRIDE PANEL HTML -->
  <div id="secretPanel" class="secret-overlay" style="display: none;">
    <div class="secret-card">
      <div class="secret-header">
        <h2>CLASSIFIED // OVERRIDE PANEL</h2>
        <button class="close-secret-btn" onclick="toggleSecretPanel(false)">✕</button>
      </div>

      <div class="secret-body">
        <div class="secret-row">
          <label>System Visual Effect:</label>
          <button class="secret-btn" onclick="triggerGlitchEffect()">TEST GLITCH MATRIX</button>
        </div>

        <div class="secret-row">
          <label>XTTS Engine Mode:</label>
          <button class="secret-btn" onclick="alert('Local XTTS Voice Priority Enabled')">FORCE LOCAL TTS</button>
        </div>

        <div class="secret-row">
          <label>System Diagnostics:</label>
          <span style="color:#00ff66; font-weight:bold;">ALL SYSTEMS NOMINAL</span>
        </div>

        <div class="secret-row">
          <label>Emergency Protocols:</label>
          <button class="secret-btn danger" onclick="location.reload()">HARD REBOOT HUD</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    /* ========================================== */
    /* 1. CONFIGURATION & STATE                   */
    /* ========================================== */
    // Add your Groq API key below
    const GROQ_API_KEY = "YOUR_GROQ_API_KEY_HERE"; 
    const LOCAL_XTTS_URL = "http://localhost:5000/clone-voice";

    const responseText = document.getElementById("responseText");
    const userInput = document.getElementById("userInput");

    /* ========================================== */
    /* 2. THREE.JS 3D HOLOGRAM ORB RENDERING      */
    /* ========================================== */
    let scene, camera, renderer, sphere, particleSystem;

    function initHologram() {
      const container = document.getElementById("hologramContainer");
      
      scene = new THREE.Scene();
      camera = new THREE.PerspectiveCamera(75, 1, 0.1, 1000);
      camera.position.z = 2.5;

      renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
      renderer.setSize(340, 340);
      container.appendChild(renderer.domElement);

      // Wireframe Inner Core
      const geometry = new THREE.IcosahedronGeometry(1, 2);
      const material = new THREE.MeshBasicMaterial({
        color: 0x00f3ff,
        wireframe: true,
        transparent: true,
        opacity: 0.8
      });
      sphere = new THREE.Mesh(geometry, material);
      scene.add(sphere);

      // Outer Particles
      const particlesGeo = new THREE.BufferGeometry();
      const count = 300;
      const positions = new Float32Array(count * 3);

      for(let i = 0; i < count * 3; i++) {
        positions[i] = (Math.random() - 0.5) * 3;
      }

      particlesGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
      const particleMat = new THREE.PointsMaterial({
        size: 0.03,
        color: 0xff0055,
        transparent: true,
        opacity: 0.6
      });

      particleSystem = new THREE.Points(particlesGeo, particleMat);
      scene.add(particleSystem);

      animate();
    }

    function animate() {
      requestAnimationFrame(animate);
      sphere.rotation.x += 0.005;
      sphere.rotation.y += 0.008;
      particleSystem.rotation.y -= 0.003;
      renderer.render(scene, camera);
    }

    initHologram();

    /* ========================================== */
    /* 3. AI PROCESSING & VOICE CLONING TTS       */
    /* ========================================== */
    async function processUserPrompt() {
      const text = userInput.value.trim();
      if (!text) return;

      userInput.value = "";
      responseText.innerText = "PROCESSING COMMAND...";

      // Check for secret panel voice/text commands
      const lower = text.toLowerCase();
      if (lower.includes("secret panel") || lower.includes("open secret") || lower.includes("classified menu")) {
        toggleSecretPanel(true);
        responseText.innerText = "CLASSIFIED OVERRIDE PANEL ACTIVATED.";
        return;
      }

      try {
        // Send query to Groq LLaMA 3
        const aiResponse = await fetchGroqResponse(text);
        responseText.innerText = aiResponse;

        // Speak response using local XTTS v2 engine
        await playLocalXTTSVoice(aiResponse);

      } catch (err) {
        console.error("Pipeline Error:", err);
        responseText.innerText = "ERROR PROCESSING COMMAND. CHECK CONNECTION.";
      }
    }

    async function fetchGroqResponse(promptText) {
      if (!GROQ_API_KEY || GROQ_API_KEY === "YOUR_GROQ_API_KEY_HERE") {
        return "Please set your valid Groq API key inside the JavaScript code.";
      }

      const res = await fetch("https://api.groq.com/openai/v1/chat/completions", {
        method: "POST",
        headers: {
          "Authorization": `Bearer ${GROQ_API_KEY}`,
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          model: "llama-3.3-70b-versatile",
          messages: [
            { role: "system", content: "You are Shruti AI, a fast, futuristic cybernetic assistant. Keep responses brief (1-3 sentences max) for fast text-to-speech." },
            { role: "user", content: promptText }
          ]
        })
      });

      const data = await res.json();
      return data.choices[0].message.content;
    }

    async function playLocalXTTSVoice(textToSpeak) {
      try {
        const response = await fetch(LOCAL_XTTS_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ text: textToSpeak })
        });

        if (!response.ok) throw new Error("Local XTTS engine not reachable");

        const audioBlob = await response.blob();
        const audioUrl = URL.createObjectURL(audioBlob);
        const audio = new Audio(audioUrl);
        
        // Pulse orb faster while speaking
        sphere.material.color.setHex(0xff0055);
        audio.play();

        audio.onended = () => {
          sphere.material.color.setHex(0x00f3ff);
        };

      } catch (err) {
        console.warn("Local XTTS unavailable. Ensure server.py is running on localhost:5000.");
      }
    }

    /* ========================================== */
    /* 4. VOICE SPEECH RECOGNITION (STT)         */
    /* ========================================== */
    function startVoiceRecognition() {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) {
        alert("Speech Recognition not supported on this browser.");
        return;
      }

      const recognition = new SpeechRecognition();
      recognition.lang = "en-US";
      responseText.innerText = "LISTENING...";

      recognition.onresult = (event) => {
        const transcript = event.results[0][0].transcript;
        userInput.value = transcript;
        processUserPrompt();
      };

      recognition.onerror = () => {
        responseText.innerText = "VOICE INPUT ERROR. RE-TRYING...";
      };

      recognition.start();
    }

    /* ========================================== */
    /* 5. SECRET PANEL TRIGGER MECHANISMS        */
    /* ========================================== */
    function toggleSecretPanel(show) {
      const panel = document.getElementById("secretPanel");
      panel.style.display = show ? "flex" : "none";
    }

    // TRIGGER METHOD 1: Keyboard Shortcut (Ctrl + Shift + S)
    window.addEventListener("keydown", (e) => {
      if (e.ctrlKey && e.shiftKey && (e.key === "S" || e.key === "s")) {
        e.preventDefault();
        const panel = document.getElementById("secretPanel");
        toggleSecretPanel(panel.style.display === "none");
      }
    });

    // TRIGGER METHOD 2: 5 Quick Clicks on the Orb
    let orbClickCount = 0;
    let clickTimer = null;

    document.getElementById("hologramContainer").addEventListener("click", () => {
      orbClickCount++;
      clearTimeout(clickTimer);

      if (orbClickCount >= 5) {
        toggleSecretPanel(true);
        orbClickCount = 0;
      } else {
        clickTimer = setTimeout(() => { orbClickCount = 0; }, 1200);
      }
    });

    function triggerGlitchEffect() {
      document.body.style.filter = "invert(1) hue-rotate(180deg)";
      setTimeout(() => {
        document.body.style.filter = "none";
      }, 450);
    }
  </script>
</body>
</html>
