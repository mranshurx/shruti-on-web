<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shruti AI - Female Voice Persona & Sci-Fi HUD</title>

  <!-- High-Tech Cyberpunk Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

  <style>
    :root {
      --bg-dark: #02050e;
      --panel-bg: rgba(6, 12, 26, 0.75);
      --neon-cyan: #00f3ff;
      --cyan-glow: rgba(0, 243, 255, 0.6);
      --neon-pink: #ff0055;
      --pink-glow: rgba(255, 0, 85, 0.6);
      --neon-gold: #ffbe0b;
      --border-cyan: rgba(0, 243, 255, 0.3);
      --text-main: #e2e8f0;
      --text-sub: #64748b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Share Tech Mono', monospace;
      user-select: none;
    }

    body {
      background-color: var(--bg-dark);
      background-image: 
        radial-gradient(circle at 50% 50%, rgba(0, 243, 255, 0.08) 0%, transparent 70%),
        linear-gradient(rgba(0, 243, 255, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 243, 255, 0.03) 1px, transparent 1px);
      background-size: 100% 100%, 40px 40px, 40px 40px;
      color: var(--text-main);
      height: 100vh;
      width: 100vw;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      perspective: 1000px;
    }

    .scanline-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.4) 50%);
      background-size: 100% 4px;
      z-index: 10;
      pointer-events: none;
      opacity: 0.5;
    }

    .dashboard-viewport {
      position: relative;
      z-index: 1;
      display: grid;
      grid-template-columns: 350px 1fr;
      width: 95vw;
      height: 90vh;
      gap: 22px;
      transition: transform 0.1s ease-out;
      transform-style: preserve-3d;
    }

    .hud-card {
      background: var(--panel-bg);
      border: 1px solid var(--border-cyan);
      padding: 24px;
      display: flex;
      flex-direction: column;
      box-shadow: 0 0 30px rgba(0, 0, 0, 0.9), inset 0 0 20px rgba(0, 243, 255, 0.05);
      backdrop-filter: blur(20px);
      position: relative;
      clip-path: polygon(
        0 18px, 18px 0, 
        calc(100% - 18px) 0, 100% 18px, 
        100% calc(100% - 18px), calc(100% - 18px) 100%, 
        18px 100%, 0 calc(100% - 18px)
      );
    }

    .hud-card::before, .hud-card::after {
      content: "";
      position: absolute;
      width: 14px;
      height: 14px;
      border: 2px solid var(--neon-cyan);
      box-shadow: 0 0 10px var(--cyan-glow);
    }
    .hud-card::before { top: 2px; left: 2px; border-right: none; border-bottom: none; }
    .hud-card::after { bottom: 2px; right: 2px; border-left: none; border-top: none; }

    .brand-header {
      margin-bottom: 24px;
      border-bottom: 1px dashed var(--border-cyan);
      padding-bottom: 16px;
    }

    .brand-header h1 {
      font-family: 'Orbitron', sans-serif;
      font-size: 30px;
      font-weight: 900;
      letter-spacing: 4px;
      color: #fff;
      text-shadow: 0 0 10px var(--cyan-glow), 0 0 25px var(--neon-cyan);
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 11px;
      font-weight: bold;
      color: var(--neon-cyan);
      letter-spacing: 2px;
      margin-top: 6px;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      background: var(--neon-cyan);
      border-radius: 50%;
      box-shadow: 0 0 10px var(--neon-cyan);
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 0.3; transform: scale(0.8); }
      50% { opacity: 1; transform: scale(1.3); }
    }

    .telemetry-group {
      display: flex;
      flex-direction: column;
      gap: 16px;
      margin-bottom: 20px;
    }

    .metric-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
      letter-spacing: 1px;
      color: var(--text-main);
    }

    .progress-bar-bg {
      width: 100%;
      height: 6px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(0, 243, 255, 0.15);
      border-radius: 3px;
      overflow: hidden;
      margin-top: 6px;
    }

    .progress-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, rgba(0, 243, 255, 0.3), var(--neon-cyan));
      box-shadow: 0 0 12px var(--cyan-glow);
      width: 40%;
      transition: width 0.4s ease;
    }

    .hud-select {
      width: 100%;
      background: rgba(2, 6, 18, 0.9);
      color: var(--neon-cyan);
      border: 1px solid var(--neon-cyan);
      padding: 10px;
      font-family: 'Share Tech Mono', monospace;
      border-radius: 4px;
      outline: none;
      cursor: pointer;
      margin-top: 6px;
      box-shadow: 0 0 10px rgba(0, 243, 255, 0.1);
      transition: all 0.2s ease;
    }

    .hud-select:focus {
      box-shadow: 0 0 15px var(--cyan-glow);
    }

    .camera-hud-box {
      margin-top: auto;
      background: #000;
      border: 1px solid var(--border-cyan);
      height: 180px;
      position: relative;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    #webcamFeed {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scaleX(-1);
      opacity: 0.8;
    }

    .reticle-overlay {
      position: absolute;
      width: 90px;
      height: 90px;
      border: 1px dashed var(--neon-pink);
      border-radius: 50%;
      pointer-events: none;
      box-shadow: 0 0 15px var(--pink-glow);
      animation: scanPulse 3s infinite linear;
    }

    @keyframes scanPulse {
      0% { transform: scale(0.8) rotate(0deg); opacity: 0.4; }
      50% { transform: scale(1.15) rotate(180deg); opacity: 0.9; }
      100% { transform: scale(0.8) rotate(360deg); opacity: 0.4; }
    }

    .cam-toggle-btn {
      position: absolute;
      bottom: 12px;
      background: rgba(255, 0, 85, 0.8);
      color: #fff;
      border: 1px solid var(--neon-pink);
      padding: 6px 16px;
      font-family: 'Orbitron', sans-serif;
      font-size: 10px;
      font-weight: bold;
      letter-spacing: 1px;
      cursor: pointer;
      box-shadow: 0 0 12px var(--pink-glow);
      transition: all 0.2s ease;
    }

    .cam-toggle-btn:hover {
      background: var(--neon-pink);
      box-shadow: 0 0 20px var(--pink-glow);
    }

    .center-hud {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
    }

    .hologram-3d-viewport {
      position: relative;
      width: 100%;
      height: 420px;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
    }

    #threeCanvas {
      width: 100%;
      height: 100%;
      outline: none;
    }

    .output-console {
      width: 100%;
      background: rgba(2, 6, 18, 0.9);
      border: 1px solid var(--border-cyan);
      box-shadow: inset 0 0 20px rgba(0, 243, 255, 0.08);
      padding: 18px 22px;
      min-height: 95px;
      font-size: 16px;
      line-height: 1.5;
      border-radius: 4px;
    }

    .user-line { 
      color: var(--text-sub); 
      font-family: 'Orbitron', sans-serif; 
      font-size: 11px; 
      letter-spacing: 1.5px;
      margin-bottom: 6px; 
    }

    .ai-line { 
      color: var(--neon-cyan); 
      font-weight: bold; 
      letter-spacing: 0.5px;
      text-shadow: 0 0 10px var(--cyan-glow); 
    }

    .dock-input {
      width: 100%;
      display: flex;
      gap: 12px;
      background: rgba(2, 6, 18, 0.95);
      border: 1px solid var(--neon-cyan);
      border-radius: 40px;
      padding: 8px 14px 8px 24px;
      align-items: center;
      box-shadow: 0 0 25px rgba(0, 243, 255, 0.2);
      margin-top: 14px;
    }

    .dock-input input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: #fff;
      font-size: 15px;
      letter-spacing: 1px;
    }

    .dock-input input::placeholder {
      color: var(--text-sub);
    }

    .dock-btn {
      background: linear-gradient(135deg, var(--neon-cyan), #0072ff);
      border: none;
      color: #000;
      width: 42px;
      height: 42px;
      border-radius: 50%;
      cursor: pointer;
      font-weight: 900;
      font-size: 16px;
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 0 0 15px var(--cyan-glow);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .dock-btn:hover {
      transform: scale(1.1);
      box-shadow: 0 0 25px var(--cyan-glow);
    }
  </style>
</head>
<body>

  <div class="scanline-overlay"></div>

  <div class="dashboard-viewport" id="viewport">
    
    <div class="hud-card">
      <div class="brand-header">
        <h1>SHRUTI AI</h1>
        <div class="status-badge">
          <span class="status-dot"></span> GROQ ENGINE • ONLINE
        </div>
      </div>

      <div class="telemetry-group">
        <div>
          <div class="metric-row"><span>NEURAL CORE LOAD</span><span id="cpuVal">28%</span></div>
          <div class="progress-bar-bg"><div class="progress-bar-fill" id="cpuBar" style="width: 28%;"></div></div>
        </div>

        <div>
          <div class="metric-row"><span>MEMORY ALLOCATION</span><span id="ramVal">42%</span></div>
          <div class="progress-bar-bg"><div class="progress-bar-fill" id="ramBar" style="width: 42%;"></div></div>
        </div>

        <div>
          <div class="metric-row"><span>SPECTRUM FREQUENCY</span><span id="audioVal">0 Hz</span></div>
          <div class="progress-bar-bg"><div class="progress-bar-fill" id="audioBar" style="width: 10%;"></div></div>
        </div>

        <div>
          <div class="metric-row"><span>FEMALE VOICE PERSONA</span></div>
          <select id="femaleVoiceSelect" class="hud-select">
            <option value="jarvis">VOICE: AI ASSISTANT (CLEAR)</option>
            <option value="anime">VOICE: ANIME / HIGH PITCH</option>
            <option value="smooth">VOICE: SMOOTH & CALM</option>
            <option value="cyber">VOICE: CYBER VALKYRIE</option>
          </select>
        </div>
      </div>

      <div class="camera-hud-box">
        <video id="webcamFeed" autoplay playsinline muted></video>
        <div class="reticle-overlay"></div>
        <button class="cam-toggle-btn" onclick="toggleCamera()">INITIALIZE VISION</button>
      </div>
    </div>

    <div class="hud-card center-hud">
      <div class="hologram-3d-viewport" onclick="startListening()">
        <canvas id="threeCanvas"></canvas>
      </div>

      <div class="output-console">
        <div class="user-line" id="userText">SYSTEM READY // CLICK ARC CORE OR MIC TO SPEAK</div>
        <div class="ai-line" id="aiResponse"></div>
      </div>

      <div class="dock-input">
        <input type="text" id="textInput" placeholder="Type or speak a command for Shruti..." onkeydown="if(event.key==='Enter') sendInput()"/>
        <button class="dock-btn" onclick="startListening()">🎙</button>
        <button class="dock-btn" onclick="sendInput()">➔</button>
      </div>
    </div>

  </div>

  <script>
    const viewport = document.getElementById("viewport");
    const userText = document.getElementById("userText");
    const aiResponse = document.getElementById("aiResponse");

    const GROQ_API_KEY = "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";
    const GROQ_MODEL = "llama-3.3-70b-versatile";
    const GROQ_ENDPOINT = "https://api.groq.com/openai/v1/chat/completions";

    let systemState = "idle";
    let cameraStream = null;
    let audioCtx, analyser, dataArray;
    let availableVoices = [];

    // Pre-warm Web Speech API Voices early to reduce initial latency
    function loadVoices() {
      if ('speechSynthesis' in window) {
        availableVoices = window.speechSynthesis.getVoices();
      }
    }
    loadVoices();
    if ('speechSynthesis' in window) {
      window.speechSynthesis.onvoiceschanged = loadVoices;
    }

    window.addEventListener("mousemove", (e) => {
      const cx = window.innerWidth / 2;
      const cy = window.innerHeight / 2;
      const rx = ((e.clientY - cy) / cy) * -5;
      const ry = ((e.clientX - cx) / cx) * 5;
      viewport.style.transform = `rotateX(${rx}deg) rotateY(${ry}deg)`;
    });

    // Three.js Hologram Setup
    const container = document.querySelector('.hologram-3d-viewport');
    const canvas = document.getElementById('threeCanvas');

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 1000);
    camera.position.z = 6.5;

    const renderer = new THREE.WebGLRenderer({ canvas: canvas, alpha: true, antialias: true });
    renderer.setSize(container.clientWidth, container.clientHeight);
    renderer.setPixelRatio(window.devicePixelRatio);

    const orbGeo = new THREE.IcosahedronGeometry(0.7, 3);
    const orbMat = new THREE.MeshBasicMaterial({ color: 0x00f3ff, wireframe: true, transparent: true, opacity: 0.9 });
    const innerOrb = new THREE.Mesh(orbGeo, orbMat);
    scene.add(innerOrb);

    const torusGeo = new THREE.TorusGeometry(1.3, 0.08, 16, 100);
    const torusMat = new THREE.MeshBasicMaterial({ color: 0xff0055, wireframe: true, transparent: true, opacity: 0.8 });
    const middleRing = new THREE.Mesh(torusGeo, torusMat);
    scene.add(middleRing);

    const outerRingGeo = new THREE.TorusGeometry(1.8, 0.03, 8, 120);
    const outerRingMat = new THREE.MeshBasicMaterial({ color: 0x00f3ff, wireframe: true, transparent: true, opacity: 0.5 });
    const outerRing = new THREE.Mesh(outerRingGeo, outerRingMat);
    scene.add(outerRing);

    const pCount = 300;
    const pGeo = new THREE.BufferGeometry();
    const pPositions = new Float32Array(pCount * 3);

    for(let i = 0; i < pCount * 3; i++) {
      pPositions[i] = (Math.random() - 0.5) * 5.5;
    }
    pGeo.setAttribute('position', new THREE.BufferAttribute(pPositions, 3));
    const pMat = new THREE.PointsMaterial({ size: 0.03, color: 0x00f3ff, transparent: true, opacity: 0.8 });
    const particleField = new THREE.Points(pGeo, pMat);
    scene.add(particleField);

    window.addEventListener('resize', () => {
      const width = container.clientWidth;
      const height = container.clientHeight;
      renderer.setSize(width, height);
      camera.aspect = width / height;
      camera.updateProjectionMatrix();
    });

    function animate3D() {
      requestAnimationFrame(animate3D);

      let volume = 0;
      if (analyser && systemState === "listening") {
        analyser.getByteFrequencyData(dataArray);
        let sum = 0;
        for (let i = 0; i < dataArray.length; i++) sum += dataArray[i];
        volume = (sum / dataArray.length) * 0.02;
        document.getElementById("audioBar").style.width = Math.min(100, volume * 150) + "%";
        document.getElementById("audioVal").innerText = Math.round(volume * 500) + " Hz";
      }

      const speed = systemState === "thinking" ? 0.04 : systemState === "listening" ? 0.025 : 0.01;

      innerOrb.rotation.y += speed * 1.5;
      innerOrb.rotation.x -= speed;

      middleRing.rotation.x += speed * 1.2;
      middleRing.rotation.y += speed * 0.8;

      outerRing.rotation.z -= speed * 0.5;
      particleField.rotation.y += 0.003;

      if (systemState === "listening") {
        orbMat.color.setHex(0xffbe0b);
        torusMat.color.setHex(0xffbe0b);
        const scale = 1 + volume;
        innerOrb.scale.set(scale, scale, scale);
      } else if (systemState === "thinking") {
        orbMat.color.setHex(0x00f3ff);
        torusMat.color.setHex(0xff0055);
      } else {
        orbMat.color.setHex(0x00f3ff);
        torusMat.color.setHex(0xff0055);
        innerOrb.scale.set(1, 1, 1);
      }

      renderer.render(scene, camera);
    }
    animate3D();

    window.onload = () => {
      setInterval(() => {
        const cpu = Math.floor(Math.random() * 15) + 20;
        const ram = Math.floor(Math.random() * 8) + 40;
        document.getElementById("cpuBar").style.width = cpu + "%";
        document.getElementById("cpuVal").innerText = cpu + "%";
        document.getElementById("ramBar").style.width = ram + "%";
        document.getElementById("ramVal").innerText = ram + "%";
      }, 3000);
    };

    async function toggleCamera() {
      const video = document.getElementById("webcamFeed");
      if (!cameraStream) {
        try {
          cameraStream = await navigator.mediaDevices.getUserMedia({ video: true });
          video.srcObject = cameraStream;
        } catch (e) {
          alert("Unable to access camera feed.");
        }
      } else {
        cameraStream.getTracks().forEach(track => track.stop());
        video.srcObject = null;
        cameraStream = null;
      }
    }

    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    const recognition = new SpeechRecognition();
    recognition.lang = 'hi-IN';

    async function startListening() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        analyser = audioCtx.createAnalyser();
        analyser.fftSize = 64;
        dataArray = new Uint8Array(analyser.frequencyBinCount);

        try {
          const mic = await navigator.mediaDevices.getUserMedia({ audio: true });
          const src = audioCtx.createMediaStreamSource(mic);
          src.connect(analyser);
        } catch(e) {}
      }

      try {
        window.speechSynthesis.cancel(); // Stop active speech immediately on listen
        recognition.start();
        systemState = "listening";
        userText.innerText = "LISTENING TO SPEECH INPUT...";
        aiResponse.innerText = "";
      } catch (e) {}
    }

    recognition.onend = () => {
      if (systemState !== "thinking") systemState = "idle";
    };

    recognition.onresult = async (e) => {
      const text = e.results[0][0].transcript;
      userText.innerText = `>> USER INPUT: "${text}"`;
      await processCommand(text);
    };

    function sendInput() {
      const text = document.getElementById("textInput").value.trim();
      if (text) {
        userText.innerText = `>> USER INPUT: "${text}"`;
        processCommand(text);
        document.getElementById("textInput").value = "";
      }
    }

    async function processCommand(text) {
      systemState = "thinking";
      const lower = text.toLowerCase();
      let reply = "";

      if (lower.includes("shutdown") || lower.includes("shut down") || lower.includes("बंद करो")) {
        reply = "Shutdown trigger received. Executing PC shutdown protocol...";
        fetch('http://localhost:5000/shutdown', { method: 'POST' }).catch(() => {});
      } else if (lower.includes("यूट्यूब") || lower.includes("youtube")) {
        reply = "Opening YouTube interface...";
        window.open("https://www.youtube.com", "_blank");
      } else {
        reply = await fetchGroqAI(text);
      }

      systemState = "idle";
      aiResponse.innerText = `>> SHRUTI: ${reply}`;
      
      // Trigger Instant Pipelined Female Voice Speech Engine
      speakFemaleVoiceFast(reply);
    }

    async function fetchGroqAI(prompt) {
      // System prompt strict instructions for ultra-fast audio output
      const systemPrompt = "You are Shruti, a sharp sci-fi AI assistant. Reply strictly in 1 short Hindi or Hinglish sentence without special characters or symbols.";
      try {
        const res = await fetch(GROQ_ENDPOINT, {
          method: "POST",
          headers: { 
            "Content-Type": "application/json", 
            "Authorization": `Bearer ${GROQ_API_KEY}` 
          },
          body: JSON.stringify({ 
            model: GROQ_MODEL, 
            messages: [
              { role: "system", content: systemPrompt }, 
              { role: "user", content: prompt }
            ],
            max_tokens: 60, // Enforces fast token generation latency
            temperature: 0.6
          })
        });
        const data = await res.json();
        return data.choices?.[0]?.message?.content?.trim() || "प्रतिक्रिया प्राप्त करने में विफलता।";
      } catch (err) {
        return "Groq API कनेक्शन विफल रहा।";
      }
    }

    // ==========================================
    // OPTIMIZED RAPID-STREAM SPEECH ENGINE
    // ==========================================
    function speakFemaleVoiceFast(text) {
      if (!('speechSynthesis' in window)) return;

      window.speechSynthesis.cancel(); // Flush lingering audio buffer queue

      // Sanitize text from non-verbal formatting tags like **, ##, ```, etc.
      const cleanText = text.replace(/[*_#`~[\]()]/g, '').trim();
      
      // Split into sentence chunks to instantly start speech pipeline
      const sentences = cleanText.split(/(?<=[.!?|।])\s+/);

      const mode = document.getElementById("femaleVoiceSelect").value;
      const femaleVoices = availableVoices.filter(v => 
        v.lang.includes("hi") || v.lang.includes("IN") || v.name.toLowerCase().includes("female") || v.name.toLowerCase().includes("zira") || v.name.toLowerCase().includes("google")
      );

      sentences.forEach((sentence) => {
        if (!sentence.trim()) return;

        const ut = new SpeechSynthesisUtterance(sentence);
        if (femaleVoices.length > 0) ut.voice = femaleVoices[0];

        if (mode === "jarvis") {
          ut.pitch = 1.25;
          ut.rate = 1.15; // Slightly boosted speed for rapid feedback
        } else if (mode === "anime") {
          ut.pitch = 1.6;
          ut.rate = 1.25;
        } else if (mode === "smooth") {
          ut.pitch = 1.0;
          ut.rate = 1.05;
        } else if (mode === "cyber") {
          ut.pitch = 1.4;
          ut.rate = 1.3;
        }

        ut.lang = 'hi-IN';
        window.speechSynthesis.speak(ut);
      });
    }
  </script>
</body>
</html>
