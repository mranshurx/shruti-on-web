<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shruti AI - Holographic HUD Interface</title>

  <!-- Google Fonts for Cyberpunk HUD Aesthetics -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

  <style>
    :root {
      --bg-dark: #030712;
      --panel-bg: rgba(9, 14, 26, 0.75);
      --red-primary: #ff003c;
      --red-glow: rgba(255, 0, 60, 0.6);
      --cyan-primary: #00f0ff;
      --cyan-glow: rgba(0, 240, 255, 0.5);
      --gold-primary: #ffb703;
      --border-color: rgba(255, 0, 60, 0.35);
      --border-cyan: rgba(0, 240, 255, 0.35);
      --text-bright: #f8fafc;
      --text-muted: #64748b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Rajdhani', sans-serif;
      user-select: none;
    }

    body {
      background-color: var(--bg-dark);
      background-image: 
        radial-gradient(circle at 50% 50%, rgba(255, 0, 60, 0.08) 0%, transparent 60%),
        linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
      background-size: 100% 100%, 30px 30px, 30px 30px;
      color: var(--text-bright);
      height: 100vh;
      width: 100vw;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      perspective: 1200px;
    }

    /* CRT Scanlines Overlay */
    .scanlines {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.3) 50%);
      background-size: 100% 4px;
      z-index: 10;
      pointer-events: none;
      opacity: 0.6;
    }

    /* 3D Dynamic Viewport */
    .dashboard-viewport {
      position: relative;
      z-index: 1;
      display: grid;
      grid-template-columns: 340px 1fr;
      width: 96vw;
      height: 92vh;
      gap: 20px;
      transition: transform 0.1s ease-out;
      transform-style: preserve-3d;
    }

    /* Sci-Fi Chamfered HUD Panel */
    .hud-card {
      background: var(--panel-bg);
      border: 1px solid var(--border-color);
      padding: 24px;
      display: flex;
      flex-direction: column;
      box-shadow: 0 0 35px rgba(0, 0, 0, 0.9), inset 0 0 25px rgba(255, 0, 60, 0.05);
      backdrop-filter: blur(16px);
      position: relative;
      clip-path: polygon(
        0 20px, 20px 0, 
        calc(100% - 20px) 0, 100% 20px, 
        100% calc(100% - 20px), calc(100% - 20px) 100%, 
        20px 100%, 0 calc(100% - 20px)
      );
    }

    /* Glowing HUD Corner Brackets */
    .hud-card::before, .hud-card::after {
      content: "";
      position: absolute;
      width: 16px;
      height: 16px;
      border: 2px solid var(--red-primary);
      box-shadow: 0 0 8px var(--red-glow);
    }
    .hud-card::before { top: 2px; left: 2px; border-right: none; border-bottom: none; }
    .hud-card::after { bottom: 2px; right: 2px; border-left: none; border-top: none; }

    /* Left Sidebar Styling */
    .brand-header {
      margin-bottom: 24px;
      border-bottom: 1px dashed var(--border-color);
      padding-bottom: 14px;
    }

    .brand-header h1 {
      font-family: 'Orbitron', sans-serif;
      font-size: 28px;
      font-weight: 900;
      letter-spacing: 4px;
      color: #fff;
      text-shadow: 0 0 12px var(--red-glow), 0 0 20px var(--red-primary);
    }

    .brand-header .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      font-weight: 700;
      color: var(--cyan-primary);
      letter-spacing: 2px;
      margin-top: 4px;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      background: var(--cyan-primary);
      border-radius: 50%;
      box-shadow: 0 0 8px var(--cyan-primary);
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 0.3; transform: scale(0.8); }
      50% { opacity: 1; transform: scale(1.2); }
    }

    /* Telemetry Metrics */
    .telemetry-group {
      display: flex;
      flex-direction: column;
      gap: 16px;
      margin-bottom: 20px;
    }

    .metric-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 1.5px;
      color: var(--text-bright);
    }

    .progress-bar-bg {
      width: 100%;
      height: 6px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 2px;
      overflow: hidden;
      margin-top: 6px;
    }

    .progress-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, rgba(255, 0, 60, 0.4), var(--red-primary));
      box-shadow: 0 0 10px var(--red-glow);
      width: 40%;
      transition: width 0.4s ease;
    }

    /* Camera HUD Feed */
    .camera-hud-box {
      margin-top: auto;
      background: #000;
      border: 1px solid var(--border-color);
      height: 200px;
      position: relative;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    #webcamFeed {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scaleX(-1);
      opacity: 0.85;
    }

    .reticle-overlay {
      position: absolute;
      width: 100px;
      height: 100px;
      border: 1px dashed var(--cyan-primary);
      border-radius: 50%;
      pointer-events: none;
      box-shadow: 0 0 12px var(--cyan-glow);
      animation: scanPulse 3s infinite linear;
    }

    @keyframes scanPulse {
      0% { transform: scale(0.8) rotate(0deg); opacity: 0.4; }
      50% { transform: scale(1.1) rotate(180deg); opacity: 0.9; }
      100% { transform: scale(0.8) rotate(360deg); opacity: 0.4; }
    }

    .cam-toggle-btn {
      position: absolute;
      bottom: 12px;
      background: rgba(255, 0, 60, 0.8);
      color: #fff;
      border: 1px solid var(--red-primary);
      padding: 6px 16px;
      font-family: 'Orbitron', sans-serif;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 1.5px;
      cursor: pointer;
      box-shadow: 0 0 12px var(--red-glow);
      transition: all 0.2s ease;
    }

    .cam-toggle-btn:hover {
      background: var(--red-primary);
      box-shadow: 0 0 20px var(--red-glow);
    }

    /* Center Main Panel */
    .center-hud {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      border-color: var(--border-cyan);
    }

    /* Hologram 3D Canvas Area */
    .hologram-3d-viewport {
      position: relative;
      width: 100%;
      height: 400px;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
    }

    #threeCanvas {
      width: 100%;
      height: 100%;
      outline: none;
    }

    /* Terminal Console Display */
    .output-console {
      width: 100%;
      background: rgba(4, 8, 16, 0.85);
      border: 1px solid var(--border-cyan);
      box-shadow: inset 0 0 15px rgba(0, 240, 255, 0.05);
      padding: 18px 22px;
      min-height: 100px;
      font-size: 15px;
      line-height: 1.6;
      border-radius: 4px;
    }

    .user-line { 
      color: #94a3b8; 
      font-family: 'Orbitron', sans-serif; 
      font-size: 12px; 
      letter-spacing: 1px;
      margin-bottom: 8px; 
    }

    .ai-line { 
      color: var(--cyan-primary); 
      font-weight: 700; 
      letter-spacing: 0.5px;
      text-shadow: 0 0 8px var(--cyan-glow); 
    }

    /* Input Dock */
    .dock-input {
      width: 100%;
      display: flex;
      gap: 12px;
      background: rgba(4, 8, 16, 0.9);
      border: 1px solid var(--border-cyan);
      border-radius: 40px;
      padding: 8px 12px 8px 24px;
      align-items: center;
      box-shadow: 0 0 20px rgba(0, 240, 255, 0.15);
      margin-top: 14px;
    }

    .dock-input input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: #fff;
      font-size: 15px;
      letter-spacing: 1px;
    }

    .dock-input input::placeholder {
      color: var(--text-muted);
    }

    .dock-btn {
      background: linear-gradient(135deg, var(--cyan-primary), #0072ff);
      border: none;
      color: #000;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      cursor: pointer;
      font-weight: 900;
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 0 0 15px var(--cyan-glow);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .dock-btn:hover {
      transform: scale(1.08);
      box-shadow: 0 0 25px var(--cyan-glow);
    }
  </style>
</head>
<body>

  <div class="scanlines"></div>

  <div class="dashboard-viewport" id="viewport">
    
    <!-- LEFT CONTROL PANEL -->
    <div class="hud-card">
      <div class="brand-header">
        <h1>SHRUTI AI</h1>
        <div class="status-badge">
          <span class="status-dot"></span> GROQ ENGINE ONLINE
        </div>
      </div>

      <div class="telemetry-group">
        <div>
          <div class="metric-row"><span>NEURAL CORE LOAD</span><span id="cpuVal">28%</span></div>
          <div class="progress-bar-bg"><div class="progress-bar-fill" id="cpuBar" style="width: 28%;"></div></div>
        </div>
        <div>
          <div class="metric-row"><span>MEMORY ALLOCATION</span><span id="ramVal">42%</span></div>
          <div class="progress-bar-bg"><div class="progress-bar-fill" id="ramBar" style="width: 42%;"></div></div>
        </div>
        <div>
          <div class="metric-row"><span>AUDIO FREQUENCY</span><span id="audioVal">0 Hz</span></div>
          <div class="progress-bar-bg"><div class="progress-bar-fill" id="audioBar" style="width: 10%;"></div></div>
        </div>
      </div>

      <div class="camera-hud-box">
        <video id="webcamFeed" autoplay playsinline muted></video>
        <div class="reticle-overlay"></div>
        <button class="cam-toggle-btn" onclick="toggleCamera()">INITIALIZE VISION</button>
      </div>
    </div>

    <!-- CENTER 3D HOLOGRAM PANEL -->
    <div class="hud-card center-hud">
      <div class="hologram-3d-viewport" onclick="startListening()">
        <canvas id="threeCanvas"></canvas>
      </div>

      <div class="output-console">
        <div class="user-line" id="userText">SYSTEM READY // CLICK CORE OR MIC TO COMMUNICATE</div>
        <div class="ai-line" id="aiResponse"></div>
      </div>

      <div class="dock-input">
        <input type="text" id="textInput" placeholder="Enter command for Shruti AI..." onkeydown="if(event.key==='Enter') sendInput()"/>
        <button class="dock-btn" onclick="startListening()">🎙</button>
        <button class="dock-btn" onclick="sendInput()">➔</button>
      </div>
    </div>

  </div>

  <script>
    const viewport = document.getElementById("viewport");
    const userText = document.getElementById("userText");
    const aiResponse = document.getElementById("aiResponse");

    // Locked Groq API Credentials
    const GROQ_API_KEY = "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";
    const GROQ_MODEL = "llama-3.3-70b-versatile";
    const GROQ_ENDPOINT = "https://api.groq.com/openai/v1/chat/completions";

    let systemState = "idle"; // "idle", "listening", "thinking"
    let cameraStream = null;
    let audioCtx, analyser, dataArray;

    // --- 3D Parallax Tilt Effect ---
    window.addEventListener("mousemove", (e) => {
      const cx = window.innerWidth / 2;
      const cy = window.innerHeight / 2;
      const rx = ((e.clientY - cy) / cy) * -6;
      const ry = ((e.clientX - cx) / cx) * 6;
      viewport.style.transform = `rotateX(${rx}deg) rotateY(${ry}deg)`;
    });

    // ==========================================
    // THREE.JS UPGRADED HOLOGRAM ENGINE
    // ==========================================
    const container = document.querySelector('.hologram-3d-viewport');
    const canvas = document.getElementById('threeCanvas');

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 1000);
    camera.position.z = 6;

    const renderer = new THREE.WebGLRenderer({ canvas: canvas, alpha: true, antialias: true });
    renderer.setSize(container.clientWidth, container.clientHeight);
    renderer.setPixelRatio(window.devicePixelRatio);

    // 1. Outer Hologram Geometry (Torus Knot)
    const torusGeo = new THREE.TorusKnotGeometry(1.1, 0.22, 128, 32);
    const torusMat = new THREE.MeshBasicMaterial({
      color: 0xff003c,
      wireframe: true,
      transparent: true,
      opacity: 0.75
    });
    const torusKnot = new THREE.Mesh(torusGeo, torusMat);
    scene.add(torusKnot);

    // 2. Inner Glowing Core
    const coreGeo = new THREE.IcosahedronGeometry(0.75, 2);
    const coreMat = new THREE.MeshBasicMaterial({
      color: 0x00f0ff,
      wireframe: true,
      transparent: true,
      opacity: 0.9
    });
    const innerCore = new THREE.Mesh(coreGeo, coreMat);
    scene.add(innerCore);

    // 3. Futuristic HUD Orbiting Rings
    const ringGeo = new THREE.RingGeometry(1.6, 1.62, 64);
    const ringMat = new THREE.MeshBasicMaterial({ color: 0x00f0ff, side: THREE.DoubleSide, transparent: true, opacity: 0.4 });
    const hudRing = new THREE.Mesh(ringGeo, ringMat);
    hudRing.rotation.x = Math.PI / 2;
    scene.add(hudRing);

    // 4. Glowing Particle Field
    const particleCount = 350;
    const particlesGeo = new THREE.BufferGeometry();
    const posArray = new Float32Array(particleCount * 3);

    for(let i = 0; i < particleCount * 3; i++) {
      posArray[i] = (Math.random() - 0.5) * 5;
    }
    particlesGeo.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
    const particlesMat = new THREE.PointsMaterial({
      size: 0.03,
      color: 0x00f0ff,
      transparent: true,
      opacity: 0.8
    });
    const particleParticles = new THREE.Points(particlesGeo, particlesMat);
    scene.add(particleParticles);

    // Resize Handler
    window.addEventListener('resize', () => {
      const width = container.clientWidth;
      const height = container.clientHeight;
      renderer.setSize(width, height);
      camera.aspect = width / height;
      camera.updateProjectionMatrix();
    });

    // Render Animation Loop
    function animate3D() {
      requestAnimationFrame(animate3D);

      let volume = 0;
      if (analyser && systemState === "listening") {
        analyser.getByteFrequencyData(dataArray);
        let sum = 0;
        for (let i = 0; i < dataArray.length; i++) sum += dataArray[i];
        volume = (sum / dataArray.length) * 0.02;
        document.getElementById("audioBar").style.width = Math.min(100, volume * 150) + "%";
        document.getElementById("audioVal").innerText = Math.round(volume * 500) + " Hz";
      }

      const speed = systemState === "thinking" ? 0.04 : systemState === "listening" ? 0.025 : 0.008;

      torusKnot.rotation.x += speed;
      torusKnot.rotation.y += speed * 0.8;
      innerCore.rotation.x -= speed * 1.5;
      innerCore.rotation.y += speed * 1.2;
      hudRing.rotation.z += 0.005;
      particleParticles.rotation.y += 0.002;

      // Reactivity States
      if (systemState === "listening") {
        torusMat.color.setHex(0xffb703); // Gold during Voice Input
        const scale = 1 + volume;
        torusKnot.scale.set(scale, scale, scale);
      } else if (systemState === "thinking") {
        torusMat.color.setHex(0x00f0ff); // Cyan when processing API
      } else {
        torusMat.color.setHex(0xff003c); // Vibrant Crimson Default
        torusKnot.scale.set(1, 1, 1);
      }

      renderer.render(scene, camera);
    }
    animate3D();

    // ==========================================
    // LOGIC & GROQ INTEGRATION
    // ==========================================
    window.onload = () => {
      setInterval(() => {
        const cpu = Math.floor(Math.random() * 15) + 20;
        const ram = Math.floor(Math.random() * 8) + 40;
        document.getElementById("cpuBar").style.width = cpu + "%";
        document.getElementById("cpuVal").innerText = cpu + "%";
        document.getElementById("ramBar").style.width = ram + "%";
        document.getElementById("ramVal").innerText = ram + "%";
      }, 3000);
    };

    async function toggleCamera() {
      const video = document.getElementById("webcamFeed");
      if (!cameraStream) {
        try {
          cameraStream = await navigator.mediaDevices.getUserMedia({ video: true });
          video.srcObject = cameraStream;
        } catch (e) {
          alert("Failed to access camera stream.");
        }
      } else {
        cameraStream.getTracks().forEach(track => track.stop());
        video.srcObject = null;
        cameraStream = null;
      }
    }

    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    const recognition = new SpeechRecognition();
    recognition.lang = 'hi-IN';

    async function startListening() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        analyser = audioCtx.createAnalyser();
        analyser.fftSize = 64;
        dataArray = new Uint8Array(analyser.frequencyBinCount);

        try {
          const mic = await navigator.mediaDevices.getUserMedia({ audio: true });
          const src = audioCtx.createMediaStreamSource(mic);
          src.connect(analyser);
        } catch(e) {}
      }

      try {
        recognition.start();
        systemState = "listening";
        userText.innerText = "LISTENING TO SPEECH INPUT...";
        aiResponse.innerText = "";
      } catch (e) {}
    }

    recognition.onend = () => {
      if (systemState !== "thinking") systemState = "idle";
    };

    recognition.onresult = async (e) => {
      const text = e.results[0][0].transcript;
      userText.innerText = `>> USER INPUT: "${text}"`;
      await processCommand(text);
    };

    function sendInput() {
      const text = document.getElementById("textInput").value.trim();
      if (text) {
        userText.innerText = `>> USER INPUT: "${text}"`;
        processCommand(text);
        document.getElementById("textInput").value = "";
      }
    }

    async function processCommand(text) {
      systemState = "thinking";
      const lower = text.toLowerCase();
      let reply = "";

      if (lower.includes("shutdown") || lower.includes("shut down") || lower.includes("बंद करो")) {
        reply = "Shutdown trigger received. Initiating protocol...";
        fetch('http://localhost:5000/shutdown', { method: 'POST' }).catch(() => {});
      } else if (lower.includes("यूट्यूब") || lower.includes("youtube")) {
        reply = "Opening YouTube interface...";
        window.open("https://www.youtube.com", "_blank");
      } else {
        reply = await fetchGroqAI(text);
      }

      systemState = "idle";
      aiResponse.innerText = `>> SHRUTI: ${reply}`;
      speakHindi(reply);
    }

    async function fetchGroqAI(prompt) {
      const systemPrompt = "You are Shruti, an intelligent female sci-fi HUD assistant like JARVIS. Answer politely in 1-2 short Hindi sentences.";
      try {
        const res = await fetch(GROQ_ENDPOINT, {
          method: "POST",
          headers: { 
            "Content-Type": "application/json", 
            "Authorization": `Bearer ${GROQ_API_KEY}` 
          },
          body: JSON.stringify({ 
            model: GROQ_MODEL, 
            messages: [
              { role: "system", content: systemPrompt }, 
              { role: "user", content: prompt }
            ] 
          })
        });
        const data = await res.json();
        return data.choices?.[0]?.message?.content?.trim() || "प्रतिक्रिया प्राप्त करने में त्रुटि।";
      } catch (err) {
        return "Groq API कनेक्शन विफल रहा।";
      }
    }

    function speakHindi(text) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const ut = new SpeechSynthesisUtterance(text);
        ut.lang = 'hi-IN';
        ut.pitch = 1.1;
        window.speechSynthesis.speak(ut);
      }
    }
  </script>
</body>
</html>
